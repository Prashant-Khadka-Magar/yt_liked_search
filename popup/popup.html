<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 350px;
            min-height: 200px;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
        }
        
        .container {
            text-align: center;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #fff;
        }
        
        .auth-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        
        .search-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        
        .hidden {
            display: none;
        }
        
        button {
            background: #ff4458;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin: 5px;
        }
        
        button:hover {
            background: #e63946;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 14px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        
        input[type="text"]:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        .user-info {
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .results {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }
        
        .video-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .video-item:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }
        
        .video-title {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 13px;
        }
        
        .video-channel {
            font-size: 11px;
            opacity: 0.8;
        }
        
        .loading {
            text-align: center;
            font-size: 14px;
            opacity: 0.8;
        }
        
        .error {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🔍 YT Liked Search</div>
        
        <div id="auth-section" class="auth-section">
            <div id="login-view">
                <p>Sign in with Google to search your liked videos</p>
                <button id="auth-btn">🔐 Sign In</button>
            </div>
            
            <div id="user-view" class="hidden">
                <div class="user-info">
                    <div id="user-name">Welcome!</div>
                </div>
                <button id="logout-btn">Sign Out</button>
            </div>
        </div>
        
        <div id="search-section" class="search-section hidden">
            <input type="text" id="search-input" placeholder="Search your liked videos...">
            <button id="search-btn">🔍 Search</button>
            <button id="fetch-all-btn">📥 Fetch All Liked</button>
            
            <div id="loading" class="loading hidden">Loading...</div>
            <div id="error" class="error hidden"></div>
            <div id="results" class="results"></div>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
