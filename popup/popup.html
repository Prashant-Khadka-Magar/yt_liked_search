<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./popup.css">
  <title>Popup</title>
</head>
<body>
   <div class="container">
        <div class="logo">🔍 YT Liked Search</div>
        
        <div id="auth-section" class="auth-section">
            <div id="login-view">
                <p>Sign in with Google to search your liked videos</p>
                <button id="auth-btn">🔐 Sign In</button>
            </div>
            
            <div id="user-view" class="hidden">
                <div class="user-info">
                    <div id="user-name">Welcome!</div>
                </div>
                <button id="logout-btn">Sign Out</button>
            </div>
        </div>
        
        <div id="search-section" class="search-section hidden">
            <input type="text" id="search-input" placeholder="Search your liked videos...">
            <button id="search-btn">🔍 Search</button>
            <button id="fetch-all-btn">📥 Fetch All Liked</button>
            
            <div id="loading" class="loading hidden">Loading...</div>
            <div id="error" class="error hidden"></div>
            <div id="results" class="results"></div>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
